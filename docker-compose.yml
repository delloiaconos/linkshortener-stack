# docker-compose.yml
version: "3.5"

services:
  mariadb:
    container_name: mariadb
    image: mariadb:11.8.2-ubi9
    environment:
      - MYSQL_ROOT_PASSWORD=SuperSecretPassword
      - MYSQL_USER=MariaDBUser
      - MYSQL_PASSWORD=MariaDBPass
      - MYSQL_DATABASE=dbname
    volumes:
      - mariadb-vol:/var/lib/mysql
    restart: unless-stopped

  shlink:
    image: shlinkio/shlink:stable
    container_name: shlink
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=MariaDBUser
      - DB_PASSWORD=MariaDBPass
      - DB_NAME=dbname
      - DB_DRIVER=maria
      - DEFAULT_DOMAIN=domain.io
      - IS_HTTPS_ENABLED=true
      - MATOMO_ENABLED=true
      - MATOMO_BASE_URL=http://matomo
      - MATOMO_SITE_ID=YourMatomoSiteId
      - MATOMO_API_TOKEN=YourMatomoApiToken
    ports:
      - 8080:8080
    restart: unless-stopped
    depends_on:
      - mariadb

  matomo:
    image: matomo
    container_name: matomo
    links:
      - mariadb:db
    environment:
      - MATOMO_DATABASE_HOST=mariadb
      - MATOMO_DATABASE_ADAPTER=mysql
      - MATOMO_DATABASE_USERNAME=MariaDBUser
      - MATOMO_DATABASE_PASSWORD=MariaDBPass
      - MATOMO_DATABASE_DBNAME=dbname
      - MATOMO_DATABASE_TABLES_PREFIX=mtm
    ports:
      - 8082:80
    volumes:
      - matomo-vol:/var/www/html:z
    restart: unless-stopped
    depends_on:
      - mariadb

  shlink-client:
    image: shlinkio/shlink-web-client
    container_name: shlink-client
    ports:
      - 8081:8080
    restart: unless-stopped 

volumes:
  mariadb-vol:
    driver: local
  matomo-vol:
    driver: local